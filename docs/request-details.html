<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Details</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script type="module" src="js/firebase-config.js"></script>
    <script type="module" src="js/functions.js"></script>
</head>

<body>
    <div id="navbar-container"></div>
    <div class="main-content container">
        <div class="glass-panel text-left">
            <h1 class="text-center">Request Details</h1>
            <div id="request-details" class="account-grid">
                <!-- Details injected by JS -->
            </div>
            <div class="button-group" style="justify-content: center; margin-top: 2rem;">
                <button id="cancel-request" class="cta-button"
                    style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">Cancel
                    Request</button>
                <button id="back-to-dashboard" class="cta-button secondary">Back to Dashboard</button>
            </div>
        </div>
    </div>

    <div id="confirmation-modal" class="modal">
        <div class="modal-content">
            <p>Are you sure you want to cancel this request?</p>
            <button id="confirm-cancel" class="cta-button"
                style="background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3);">Yes,
                Cancel</button>
            <button id="cancel-modal" class="cta-button secondary">No, Keep Request</button>
        </div>
    </div>

    <script>
        $(function () {
            $("#navbar-container").load("navbar.html");
        });
    </script>
</body>

</html>
